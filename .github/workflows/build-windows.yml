name: Build Windows

# Builds the NSIS installer and the portable exe on a Windows runner.
# Manual run: Actions → Build Windows → Run workflow. A v* tag also uploads them to a draft release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer + portable
        run: npm run dist:win
        env:
          # No code-signing certificate: build unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: CapriDesktop-windows
          path: |
            release/CapriDesktop-Setup-*.exe
            release/CapriDesktop-Portable-*.exe
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/CapriDesktop-Setup-*.exe
            release/CapriDesktop-Portable-*.exe
