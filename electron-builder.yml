# Windows installer (NSIS) + portable exe: npm run dist:win. Portable only: npm run dist:win:portable.
# Linux .deb: npm run dist:linux
# Crow Companion is its own app (own appId), so it never installs over or shares data with Capri Desktop
appId: dev.mycroftcanner.crowcompanion
productName: Crow Companion
copyright: Copyright © 2026 nunezValen, MycroftCanner2 (Crow Companion)

directories:
  output: release
  buildResources: assets

files:
  - out/**
  - package.json

# Read-only runtime resources, placed next to app.asar (process.resourcesPath)
extraResources:
  - from: scripts
    to: scripts
    filter:
      - '*.py'
      - '*.ps1'
      - requirements.txt
      - Modelfile.capri
  # Patch scripts Capri reads after an update (one per version and language)
  - from: scripts-capri
    to: scripts-capri
    filter:
      - '*.txt'
  - from: assets
    to: assets
    filter:
      - icon.png
      - icon.ico
      - game_data/**
      - '!game_data/learned_drawings/*.json'
      - '!game_data/cyberpunk_mod/commands.json'
      - capri_voice/voice_config.json
      - capri_voice/voice_config.example.json
  # Tallow's brain runs in llama.cpp's llama-server (scripts/crow/build-llama-server-win.sh). The model
  # itself is NOT bundled: it is downloaded from Hugging Face on first open into CrowCompanion-Data.
  - from: vendor/llama/win32-x64
    to: llama
    filter:
      - llama-server.exe
      - llama-server-compat.exe
      - LICENSE-llama.cpp.txt
      - VERSION.txt
  # Marks the unzipped folder as portable: data goes to CrowCompanion-Data next to the exe
  - from: assets/crow-portable-marker/crow-portable
    to: crow-portable
  - from: NOTICE.md
    to: NOTICE.md

linux:
  # Only .deb: an AppImage needs FUSE 2, which distros like Kali no longer ship
  target:
    - target: deb
      arch: [x64]
    # For any other distribution: extract it and run capridesktop
    - target: tar.gz
      arch: [x64]
  category: Utility
  icon: assets/icon.png
  maintainer: nunezValen
  synopsis: Tallow, a crow desktop companion
  artifactName: CrowCompanion-${version}.${ext}
  desktop:
    entry:
      Name: Crow Companion

deb:
  # Up to 0.2.0 the package was called cyber-companion: without this apt would keep both
  fpm:
    - --replaces=cyber-companion
    - --conflicts=cyber-companion
  # What Capri's features call on the desktop. FFmpeg and Ollama are handled by her setup
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    # In this order: on Ubuntu 24.04 "libasound2" alone can install liboss4-salsa, and she won't start with that
    - libasound2t64 | libasound2
  recommends:
    - xdotool
    - wmctrl
    - playerctl
    - python3-venv

win:
  target:
    - target: nsis
      arch: [x64]
    # Single self-contained exe, no install: settings go to CrowCompanion-Data next to it
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
  artifactName: CrowCompanion-Setup-${version}.${ext}

portable:
  # "portable" in the name keeps the updater from mistaking it for the installer
  artifactName: CrowCompanion-Portable-${version}.${ext}
  # Unpacks once per version instead of on every start
  unpackDirName: CrowCompanion-${version}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Crow Companion
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  # Crow look: artwork from tools/crow-art/installer_art.py, colors and texts in installer.nsh
  installerSidebar: assets/installerSidebar.bmp
  uninstallerSidebar: assets/uninstallerSidebar.bmp
  installerHeader: assets/installerHeader.bmp
  include: assets/installer.nsh
  # Language picker when the installer starts
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages:
    - en_US
    - es_ES
    - pt_BR
    - fr_FR
    - de_DE
    - it_IT
    - ru_RU
    - ja_JP
    - ko_KR
    - zh_CN
  # Launch right away: the first-run wizard asks the user's name and sets up voice / AI
  runAfterFinish: true
  deleteAppDataOnUninstall: false
